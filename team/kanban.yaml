# Dispatcher and gateway settings for the default profile (it hosts the kanban dispatcher).
# `./install.sh --kanban` applies them with `hermes config set`. Generated; do not edit.
kanban.orchestrator_profile: ""  # empty: each team's lead owns its own cards
kanban.default_assignee: "lead"  # unassigned cards go to the dev lead
kanban.max_in_progress: "4"  # cards running at once across all boards
kanban.auto_decompose: "false"  # the lead decomposes; no automatic decomposer
kanban.review_dispatch: "true"  # finished cards move to the review lane
kanban.failure_limit: "2"  # worker failures before a card blocks
kanban.dispatch_interval_seconds: "60"  # dispatcher tick
auxiliary.kanban_decomposer.provider: "anthropic"
auxiliary.kanban_decomposer.model: "claude-opus-5-5"
gateway.multiplex_profiles: "true"  # one gateway process serves the default profile and every role
