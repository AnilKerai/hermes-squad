name: analyst
version: 1.1.0
description: "Research analyst. Fact-checks researchers' findings against their sources and synthesises them into a decision brief or recommendation in ~/git/research. Non-code work only; never takes software engineering cards."
hermes_requires: ">=0.22.0"
author: "Anil Kerai"
license: MIT
env_requires:
  - name: ANTHROPIC_API_KEY
    description: "Anthropic API key. Not needed if you sign in once on the default profile (`hermes model`); profiles fall back to its credentials."
    required: false
  - name: HERMES_LANGFUSE_PUBLIC_KEY
    description: "Langfuse public key (optional tracing; needs the langfuse plugin)"
    required: false
  - name: HERMES_LANGFUSE_SECRET_KEY
    description: "Langfuse secret key (optional tracing)"
    required: false
  - name: HERMES_LANGFUSE_BASE_URL
    description: "Langfuse host (optional tracing)"
    required: false
    default: "https://cloud.langfuse.com"
  - name: HERMES_LANGFUSE_ENV
    description: "Langfuse environment, one per role so cost groups by role"
    required: false
    default: "hermes-analyst"
